<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Absensi Mahasiswa</title>

    <link rel="stylesheet" href="absensi.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <div>
                <h1>Absensi Mahasiswa</h1>
                <p>Sistem Absensi Mahasiswa</p>
            </div>
        </header>


        <!-- FORM ABSENSI -->
        <section class="card">

            <h2>Form Absensi</h2>

            <div class="form-group">

                <label for="nama">Nama Mahasiswa</label>
                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama lengkap"
                >

            </div>


            <div class="form-group">

                <label for="nim">NIM</label>
                <input
                    type="text"
                    id="nim"
                    placeholder="Masukkan NIM"
                >

            </div>


            <div class="form-group">

                <label for="mataKuliah">Mata Kuliah</label>

                <select id="mataKuliah">

                    <option value="">
                        -- Pilih Mata Kuliah --
                    </option>

                    <option value="Rekayasa Perangkat Lunak II">
                        Rekayasa Perangkat Lunak II
                    </option>

                    <option value="Sistem Pendukung Keputusan">
                        Sistem Pendukung Keputusan
                    </option>

                    <option value="Keamanan Data dan Jaringan">
                        Keamanan Data dan Jaringan
                    </option>

                    <option value="Komputer Grafik">
                        Komputer Grafik
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="status">Status Kehadiran</label>

                <select id="status">

                    <option value="">
                        -- Pilih Status --
                    </option>

                    <option value="Hadir">
                        Hadir
                    </option>

                    <option value="Izin">
                        Izin
                    </option>

                    <option value="Sakit">
                        Sakit
                    </option>

                    <option value="Alpa">
                        Alpa
                    </option>

                </select>

            </div>


            <button
                type="button"
                id="tombolAbsen"
            >
                Absen Sekarang
            </button>

        </section>


        <!-- TABEL ABSENSI -->
        <section class="card">

            <h2>Data Absensi</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>No</th>
                            <th>Nama</th>
                            <th>NIM</th>
                            <th>Mata Kuliah</th>
                            <th>Status</th>
                            <th>Tanggal</th>
                        </tr>

                    </thead>


                    <tbody id="dataAbsensi">

                    </tbody>

                </table>

            </div>

        </section>

    </div>


    <!-- JAVASCRIPT ABSENSI -->
    <script src="absensi.js"></script>

</body>
</html>
